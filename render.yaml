# Free website only. The Windows/local worker processes the shared queue.
services:
  - type: web
    name: needle-drop
    runtime: docker
    region: virginia
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: UNSUBSCRIBE_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: quiz-audio
      - key: ALLOW_DEMO
        value: 'false'
      - key: WORKER_SEND_EMAILS
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
